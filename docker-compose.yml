services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: olymp
      POSTGRES_USER: olymp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olymp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # база доступна только с самого сервера
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olymp -d olymp"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://olymp:${POSTGRES_PASSWORD:-olymp}@db:5432/olymp
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    profiles: ["cli"]   # запускается вручную: docker compose run --rm app ...

  bot:
    build: .
    restart: unless-stopped
    command: ["bot", "run"]
    env_file: .env
    volumes:
      - ./data:/app/data   # перечни (data/rsr) и база бота (data/bot.sqlite3)

  web:
    build: .
    restart: unless-stopped
    command: ["web", "run", "--host", "0.0.0.0", "--port", "8000", "--trusted-proxies", "*"]
    env_file: .env
    volumes:
      - ./data:/app/data   # та же база, что у бота: вход, кабинет, заявки
    ports:
      - "127.0.0.1:8000:8000"   # наружу — только через Caddy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
    profiles: ["https"]   # docker compose --profile https up -d

volumes:
  pgdata:
  caddy_data:
